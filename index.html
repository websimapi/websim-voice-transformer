<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Transformer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Voice Transformer</h1>
        
        <div class="voice-selector">
            <h2>Select TTS Voice</h2>
            <select id="voice-select">
                <option value="">Loading voices...</option>
            </select>
            <button id="test-voice">Test Voice</button>
        </div>
        
        <div class="recording-section">
            <h2>Record Your Voice</h2>
            <div class="controls">
                <button id="start-recording" class="primary-btn">Start Recording</button>
                <button id="stop-recording" class="primary-btn" disabled>Stop Recording</button>
            </div>
            
            <div class="status">
                <div id="status-indicator"></div>
                <span id="status-text">Not recording</span>
            </div>
        </div>
        
        <div class="output-section">
            <h2>Output</h2>
            <div id="recognized-text" class="text-box">
                <p>Your speech will appear here...</p>
            </div>
            <div class="audio-playback">
                <h3>TTS Playback</h3>
                <div id="audio-container"></div>
                <div class="tts-status-container">
                    <div id="tts-status"></div>
                    <span>Real-time TTS</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
